<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | Registration Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .admin-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 30px;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .admin-header p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            color: #1e293b;
            transition: 0.3s ease;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .admin-register-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .admin-register-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #2563eb;
        }

        @media (max-width: 480px) {
            .admin-container {
                padding: 35px 25px;
                border-radius: 18px;
            }

            .admin-header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-container">

        <div class="admin-icon">
            👤
        </div>

        <div class="logo">
            KITB
        </div>

        <div class="admin-header">
            <h1>Create Admin Account</h1>
            <p>
                Register a new administrator account for the
                registration portal.
            </p>
        </div>

        <form action="#" method="POST">

            <div class="form-group">
                <label for="admin-fullname">Full Name</label>
                <input
                    type="text"
                    id="admin-fullname"
                    name="admin_fullname"
                    placeholder="Enter full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-username">Admin Username</label>
                <input
                    type="text"
                    id="admin-username"
                    name="admin_username"
                    placeholder="Create admin username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-email">Email Address</label>
                <input
                    type="email"
                    id="admin-email"
                    name="admin_email"
                    placeholder="Enter email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input
                    type="password"
                    id="admin-password"
                    name="admin_password"
                    placeholder="Create password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="admin-register-btn">
                Create Admin Account →
            </button>

        </form>

        <div class="security-note">
            🔒 Admin accounts should only be created for authorized personnel.
        </div>

        <a href="adminLogin.html" class="back-link">
            ← Back to Admin Login
        </a>

    </main>

</body>
</html>
